<div class="bg-slate-50 h-screen">
  <div class="font-bold p-3 flex flex-row gap-3 text-blue-900 text-xl">
    <mat-icon fontSet="material-symbols-outlined">trip</mat-icon>
    <h1 class="">Trip Planner</h1>
    <button (click)="onLogout()" class="ml-auto">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
  <div class="grid grid-cols-7 grid-rows-10 md:grid-rows-7 w-full gap-5 p-5 h-200">
    <div
      class="bg-white col-span-7 row-span-4 md:col-span-4 md:row-span-7 rounded-2xl p-3 border border-zinc-100 shadow-sm"
    >
      <app-google-map-component (markerClicked)="addPlan($event)"></app-google-map-component>
    </div>
    <div
      class="bg-white col-span-7 row-span-2 md:col-span-3 md:row-span-3 rounded-2xl overflow-auto p-3 border border-zinc-100 shadow-sm"
    >
      <app-plan-schedule></app-plan-schedule>
    </div>
    <div
      class="bg-white col-span-7 rounded-2xl row-span-4 md:col-span-3 md:row-span-4 border border-zinc-100 shadow-sm"
    >
      <app-plan-list></app-plan-list>
    </div>
  </div>
</div>
