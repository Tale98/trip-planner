<div class="w-full h-screen flex items-center justify-center bg-slate-50" (submit)="onSubmit()">
    <form class="w-full max-w-sm bg-white rounded-2xl shadow-md p-6 flex flex-col gap-3" [formGroup]="loginform">
        <div class="flex flex-row items-center justify-center gap-3 text-2xl font-bold text-blue-500">
            <mat-icon class="w-12! h-12! text-[28px]! p-2 rounded-full border border-blue-150">login</mat-icon>
            <h1>Login</h1>
        </div>
        <mat-form-field appearance="outline" class="mt-8">
            <mat-label>Username</mat-label>
            <input matInput type="text" formControlName="username" class="text-blue-500">
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" class="text-blue-500">
        </mat-form-field>
        <div class="flex flex-row justify-between p-3 items-center">
            <a href="#" class="font-light underline text-sm text-left text-slate-500">Register</a>
            <a href="#" class="font-light text-sm underline text-right text-slate-500">Forgot password?</a>
        </div>
        @if(loginform.valid){
        <button type="submit" [disabled]=""
            class="w-full bg-blue-500 rounded-3xl p-3 text-xl font-semibold text-white hover:bg-white hover:text-blue-500 hover:shadow-2xl hover:shadow-blue-500 hover:animate-pulse duration-450">
            <h1>Login</h1>
        </button>
        }
    </form>
</div>
