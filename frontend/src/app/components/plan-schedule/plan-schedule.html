@for (plan of plans(); track $index){
<mat-expansion-panel [expanded]="activePlan() === plan" (afterExpand)="setActivePlan(plan)">
    <mat-expansion-panel-header>
        <mat-panel-title>Location Sequence : {{$index+1}}</mat-panel-title>
    </mat-expansion-panel-header>
    <p>{{plan.lat}}, {{plan.lng}}</p>
</mat-expansion-panel>
}
