<div class="bg-primary-dark h-screen">

        <div class="col-span-7 row-span-1 md:col-span-4 md:row-span-1 rounded-2xl p-3 bg-primary-light">
            <app-google-map-component (markerClicked)="addPlan($event)"></app-google-map-component>
        </div>
        <div class="col-span-7 bg-primary-light row-span-1 md:col-span-3 md:row-span-2 rounded-2xl overflow-auto">
            <app-plan-schedule></app-plan-schedule>
        </div>
        <div class="col-span-7 bg-primary-light rounded-2xl row-span-1 md:col-span-4 md:row-span-1">
            <app-plan-list></app-plan-list>
        </div>
    </div>
</div>
